org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# See BUILD.md — on this Windows profile the JDK's AF_UNIX self-pipe socket must
# live in a clean dir (AV real-time scanning of the profile Temp dir corrupts the
# transient socket, breaking every Gradle JVM). The universal fix is to run the
# build with TEMP/TMP pointed at C:\jtmp (build-and-install.ps1 does this).
